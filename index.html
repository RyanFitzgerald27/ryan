<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryan Fitzgerald</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 60px 40px;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #667eea;
    }
    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 1.1em;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }
    .nav-link {
      display: block;
      padding: 20px;
      background: #f8f9fa;
      border: 2px solid #667eea;
      border-radius: 8px;
      text-decoration: none;
      color: #667eea;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .nav-link:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ryan Fitzgerald</h1>
    <p class="subtitle">Explore my work</p>
    
    <div class="nav-grid">
      <a href="market-report.html" class="nav-link">Market Report</a>
      <a href="careers.html" class="nav-link">Careers</a>
      <a href="love-it-or-leave-it.html" class="nav-link">Love It or Leave It</a>
      <a href="wildwood.html" class="nav-link">Wildwood</a>
    </div>
  </div>
</body>
</html>
