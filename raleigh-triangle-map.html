<script>
(function () {
  'use strict';

  var FILL_DEFAULT = '#1c7a60';
  var FILL_HOVER   = '#26a882';
  var FILL_ACTIVE  = '#2ec9a0';

  /* Neighborhood pages — update slugs to match RaleighRealty.com URL structure */
  var URLS = {
    'durham':           'https://raleighrealty.com/durham-nc-homes-for-sale/',
    'chapel-hill':      'https://raleighrealty.com/chapel-hill-nc-homes-for-sale/',
    'morrisville':      'https://raleighrealty.com/morrisville-nc-homes-for-sale/',
    'north-raleigh':    'https://raleighrealty.com/north-raleigh-homes-for-sale/',
    'wake-forest':      'https://raleighrealty.com/wake-forest-nc-homes-for-sale/',
    'knightdale':       'https://raleighrealty.com/knightdale-nc-homes-for-sale/',
    'cary':             'https://raleighrealty.com/cary-nc-homes-for-sale/',
    'downtown-raleigh': 'https://raleighrealty.com/downtown-raleigh-homes-for-sale/',
    'apex':             'https://raleighrealty.com/apex-nc-homes-for-sale/',
    'holly-springs':    'https://raleighrealty.com/holly-springs-nc-homes-for-sale/',
    'fuquay-varina':    'https://raleighrealty.com/fuquay-varina-nc-homes-for-sale/',
    'garner':           'https://raleighrealty.com/garner-nc-homes-for-sale/',
    'clayton':          'https://raleighrealty.com/clayton-nc-homes-for-sale/'
  };

  /* Hint text labels */
  var LABELS = {
    'durham':           'Durham',
    'chapel-hill':      'Chapel Hill',
    'morrisville':      'Morrisville',
    'north-raleigh':    'North Raleigh',
    'wake-forest':      'Wake Forest & Rolesville',
    'knightdale':       'Knightdale',
    'cary':             'Cary',
    'downtown-raleigh': 'Downtown Raleigh',
    'apex':             'Apex',
    'holly-springs':    'Holly Springs',
    'fuquay-varina':    'Fuquay-Varina',
    'garner':           'Garner',
    'clayton':          'Clayton'
  };

  function getHint() {
    return document.getElementById('rrMapHint');
  }

  window.rrHover = function (el, label) {
    el.style.fill = FILL_HOVER;
    var hint = getHint();
    if (hint) {
      hint.innerHTML = '<span style="margin-right:7px;font-size:0.75rem;">&#9654;</span>' + label;
    }
  };

  window.rrOut = function (el) {
    el.style.fill = FILL_DEFAULT;
    var hint = getHint();
    if (hint) {
      hint.innerHTML = '<span style="margin-right:7px;font-size:0.75rem;">&#9654;</span>Click a region to get started';
    }
  };

  window.rrClick = function (key) {
    var el = document.getElementById('rr-' + key);
    if (el) { el.style.fill = FILL_ACTIVE; }
    var url = URLS[key];
    if (url) {
      setTimeout(function () { window.location.href = url; }, 140);
    }
  };

}());
</script>
