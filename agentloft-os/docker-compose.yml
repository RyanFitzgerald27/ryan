services:
  postgres:
    image: postgres:16-alpine
    container_name: agentloft-os-postgres
    environment:
      POSTGRES_USER: agentloft
      POSTGRES_PASSWORD: agentloft
      POSTGRES_DB: agentloft_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
