<div class="app" [class.side-collapsed]="ui.sideCollapsed">

  <aside class="side">
    <div class="brand">
      <div class="brand-word">Agent<em>loft</em></div>
      <button class="side-collapse-btn" (click)="ui.toggleSide()" [title]="ui.sideCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
        <i class="bi" [class.bi-chevron-double-left]="!ui.sideCollapsed" [class.bi-chevron-double-right]="ui.sideCollapsed"></i>
      </button>
    </div>

    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input class="search" placeholder="Search anything..." />
      <span class="kbd">⌘K</span>
    </div>

    <div class="nav-scroll">
      <div class="nav-section">Work</div>
      <a class="nav-item" routerLink="/dashboard" [class.active]="isActive('/dashboard')"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
      <a class="nav-item" routerLink="/leads" [class.active]="isActive('/leads')"><i class="bi bi-people"></i><span>Leads</span><span class="badge badge-count">101.8K</span></a>
      <a class="nav-item" routerLink="/inbox" [class.active]="isActive('/inbox')"><i class="bi bi-inbox"></i><span>Inbox</span><span class="badge badge-urgent">12</span></a>
      <a class="nav-item" routerLink="/tasks" [class.active]="isActive('/tasks')"><i class="bi bi-check2-square"></i><span>Tasks</span><span class="badge badge-count">8</span></a>
      <a class="nav-item" routerLink="/calendar" [class.active]="isActive('/calendar')"><i class="bi bi-calendar-event"></i><span>Calendar</span></a>
      <a class="nav-item" routerLink="/deals" [class.active]="isActive('/deals')"><i class="bi bi-bag"></i><span>Deals</span><span class="badge badge-count">24</span></a>

      <div class="nav-section">Growth</div>
      <a class="nav-item" routerLink="/website" [class.active]="isActive('/website')"><i class="bi bi-globe2"></i><span>Website</span></a>
      <a class="nav-item" routerLink="/listings" [class.active]="isActive('/listings')"><i class="bi bi-house"></i><span>Listings</span><span class="badge badge-count">38</span></a>
      <a class="nav-item" routerLink="/communities" [class.active]="isActive('/communities')"><i class="bi bi-buildings"></i><span>Communities</span><span class="badge badge-count">12</span></a>
      <a class="nav-item" routerLink="/blog" [class.active]="isActive('/blog')"><i class="bi bi-journal-text"></i><span>Blog</span></a>
      <a class="nav-item" routerLink="/resources" [class.active]="isActive('/resources')"><i class="bi bi-collection"></i><span>Resources</span></a>

      <div class="nav-section">Intelligence</div>
      <a class="nav-item" routerLink="/reporting" [class.active]="isActive('/reporting')"><i class="bi bi-bar-chart"></i><span>Reporting</span></a>
      <a class="nav-item" routerLink="/pond" [class.active]="isActive('/pond')"><i class="bi bi-droplet"></i><span>Pond</span><span class="badge badge-attention">87</span></a>
      <a class="nav-item" routerLink="/admin" [class.active]="isActive('/admin')"><i class="bi bi-shield-lock"></i><span>Admin</span></a>
    </div>

    <div class="user-card">
      <div class="avatar">RF</div>
      <div class="info">
        <div class="name">Ryan Fitzgerald</div>
        <div class="sub">Raleigh Realty <span class="sep">·</span> <span class="role-chip">Owner</span></div>
      </div>
      <i class="bi bi-chevron-expand chev"></i>
    </div>
  </aside>

  <main class="main">
    <router-outlet></router-outlet>
  </main>

</div>
