name: Deploy mockups to Pages

on:
  push:
    branches:
      - claude/real-estate-transaction-app-gg9I3
      - main
    paths:
      - 'agentloft-os/mockups/**'
      - '.github/workflows/deploy-mockups.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage mockups + landing
        run: |
          mkdir -p _site/mockups
          cp -r agentloft-os/mockups/* _site/mockups/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>AgentLoft OS · Mockups</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                     max-width: 640px; margin: 80px auto; padding: 0 24px; color: #18181b; }
              h1 { font-size: 22px; margin: 0 0 6px; }
              p { color: #71717a; margin: 0 0 32px; }
              a.card { display: block; padding: 18px 20px; margin-bottom: 12px;
                       border: 1px solid #e4e4e7; border-radius: 10px;
                       text-decoration: none; color: #18181b; }
              a.card:hover { background: #fafafa; border-color: #d4d4d8; }
              .label { font-weight: 600; }
              .blurb { color: #71717a; font-size: 14px; margin-top: 4px; }
            </style>
          </head>
          <body>
            <h1>AgentLoft OS — Mockups</h1>
            <p>Static design mockups. No interactivity beyond linking between pages.</p>
            <a class="card" href="mockups/index.html">
              <div class="label">Deals list →</div>
              <div class="blurb">Attio-style table, KPI strip, status pills, filters.</div>
            </a>
            <a class="card" href="mockups/deal.html">
              <div class="label">Deal detail →</div>
              <div class="blurb">Notion-style property panel + commission breakdown + activity.</div>
            </a>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
